
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Голдичечки 💗</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff0f6;color:#69324f;font:16px system-ui}main{max-width:600px;margin:auto;padding:16px}h1{text-align:center;color:#d94d91}.card{background:#fff;padding:18px;border-radius:20px;margin:14px 0;box-shadow:0 5px 24px #a54c7618}input,button{width:100%;padding:13px;margin:6px 0;border-radius:12px;font:inherit}input{border:1px solid #e8b8d0}button{border:0;background:#df5597;color:white;font-weight:700}.alt{background:#f8dfec;color:#69324f}#messages{height:42vh;min-height:220px;overflow:auto;background:#fff7fb;padding:10px;border-radius:12px}.msg{background:#f8e1ed;padding:10px;margin:8px 0;border-radius:12px;overflow-wrap:anywhere}.hidden{display:none}small{color:#966e83}.admin{border:2px solid #df5597}
</style>
</head>
<body><main>
<h1>💗 Чат Голдичечки 💗</h1>
<section class="card" id="auth">
<h3>Войти или зарегистрироваться</h3>
<input id="email" type="email" placeholder="Электронная почта">
<input id="password" type="password" placeholder="Пароль">
<button id="login">Войти</button><button class="alt" id="signup">Регистрация</button>
<p id="authStatus"></p>
</section>
<section class="card hidden" id="chat">
<p id="welcome"></p><button class="alt" id="logout">Выйти</button>
<div id="messages"></div>
<input id="message" maxlength="1000" placeholder="Напиши сообщение…">
<button id="send">Отправить 💗</button><p id="status"></p>
</section>
<section class="card admin hidden" id="admin">
<h2>👑 Админ-панель</h2>
<p>Ты вошёл как администратор.</p>
<p>Панель подключена. Очистка чата, мут и бан ещё не активированы — сначала настроим защищённые команды.</p>
</section>
</main>
<script>
const db=supabase.createClient('https://bkzvoktchnxidoeaklca.supabase.co','sb_publishable_KiTpU3ATB2S7g4YCtac2fw_34-spY-p');
const $=id=>document.getElementById(id);
let user=null,timer=null;
function say(id,s){$(id).textContent=s}
async function refresh(){
 const {data,error}=await db.from('messages').select('id,name,content,created_at').order('created_at',{ascending:true}).limit(100);
 if(error){say('status','Ошибка: '+error.message);return}
 $('messages').replaceChildren();
 for(const m of data||[]){
  const d=document.createElement('div');d.className='msg';
  const b=document.createElement('b');b.textContent=m.name+' ';
  const t=document.createElement('span');t.textContent=m.content;
  const tm=document.createElement('small');tm.textContent=' · '+new Date(m.created_at).toLocaleTimeString();
  d.append(b,t,tm);$('messages').append(d);
 }
 $('messages').scrollTop=$('messages').scrollHeight;say('status','Чат подключён 💗');
}
async function enter(){
 const {data}=await db.auth.getSession();user=data.session?.user||null;
 $('auth').classList.toggle('hidden',!!user);$('chat').classList.toggle('hidden',!user);
 $('admin').classList.add('hidden');
 if(user){
  say('welcome','Ты вошёл: '+user.email);
  const {data:roleData,error}=await db.from('chat_roles').select('role').eq('user_id',user.id).maybeSingle();
  if(!error&&roleData?.role==='admin')$('admin').classList.remove('hidden');
  await refresh();clearInterval(timer);timer=setInterval(refresh,4000);
 }else{clearInterval(timer)}
}
async function auth(action){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password){say('authStatus','Введи почту и пароль.');return}
 const {error}=await db.auth[action]({email,password});
 say('authStatus',error?error.message:'Готово! Если нужно, подтверди почту.');
 await enter();
}
$('login').onclick=()=>auth('signInWithPassword');
$('signup').onclick=()=>auth('signUp');
$('logout').onclick=async()=>{await db.auth.signOut();await enter()};
$('send').onclick=async()=>{
 if(!user)return;const content=$('message').value.trim();if(!content)return;
 $('send').disabled=true;
 const {error}=await db.from('messages').insert({name:(user.email||'Гость').split('@')[0].slice(0,30),content});
 $('send').disabled=false;
 if(error){say('status','Ошибка отправки: '+error.message);return}
 $('message').value='';await refresh();
};
$('message').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});
db.auth.onAuthStateChange(()=>setTimeout(enter,0));enter();
</script>
</body></html>
