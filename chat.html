
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>чат голдишечки 💗</title>
<style>
body{background:#17121d;color:white;font-family:Arial,sans-serif;margin:0;padding:20px}
main{max-width:500px;margin:auto}
h1{color:#ff8acb;text-align:center}
#messages{background:#251c2d;border-radius:15px;padding:12px;min-height:250px;overflow-wrap:anywhere}
.msg{background:#39283f;padding:10px;border-radius:10px;margin:8px 0}
input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;font-size:16px}
button{background:#ff65b4;color:white;font-weight:bold}
small{color:#cbb9ce}
</style>
</head>
<body>
<main>
<h1>💗 чат голдишечки 💗</h1>
<div id="messages"><p>Наш чат скоро заработает! 💕</p></div>
<input id="name" placeholder="Твоё имя" maxlength="30">
<input id="text" placeholder="Сообщение" maxlength="500">
<button id="send">Отправить 💗</button>
<p><small>Это пробная страница. Пока сообщения не передаются другому человеку.</small></p>
</main>
<script>
document.getElementById('send').onclick=()=>{
 const n=document.getElementById('name').value.trim();
 const t=document.getElementById('text').value.trim();
 if(!n||!t){alert('Напиши имя и сообщение!');return}
 const m=document.createElement('div');
 m.className='msg';
 m.textContent=n+': '+t;
 document.getElementById('messages').appendChild(m);
 document.getElementById('text').value='';
};
</script>
</body>
</html>
